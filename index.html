<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>SDR Cup New Generation</title>
	<meta name="description" content="Cuenta regresiva para la SDR Cup New Generation de Brolly.">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#070620">
	<meta property="og:title" content="SDR Cup New Generation">
	<meta property="og:description" content="Parte el martes 13 de octubre a las 10:00. Mira la cuenta regresiva.">
	<meta property="og:type" content="website">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070620'/%3E%3Crect x='7' y='5' width='18' height='22' rx='5' fill='none' stroke='%238B85F0' stroke-width='2'/%3E%3Crect x='12' y='11' width='8' height='10' rx='2.5' fill='none' stroke='%23F4F3FF' stroke-width='2'/%3E%3C/svg%3E">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@300;800&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
	<main class="escena">
		<header class="cabecera aparece" style="--i:0">
			<span>Brolly</span>
			<span class="tenue">SDR Cup #3</span>
		</header>

		<!-- Centro: el túnel de marcos y, encima, la cuenta regresiva -->
		<section class="centro" aria-label="Cuenta regresiva">
			<div class="tunel" aria-hidden="true">
				<span class="rayo" style="--giro:0deg"></span>
				<span class="rayo" style="--giro:90deg"></span>
				<span class="rayo rayo-diagonal" style="--lado:1"></span>
				<span class="rayo rayo-diagonal" style="--lado:-1"></span>
				<span class="marco" style="--n:0; --tinta:var(--lila)"></span>
				<span class="marco" style="--n:1; --tinta:var(--azul)"></span>
				<span class="marco" style="--n:2; --tinta:var(--texto)"></span>
				<span class="marco" style="--n:3; --tinta:var(--lila)"></span>
				<span class="marco" style="--n:4; --tinta:var(--azul)"></span>
				<span class="marco" style="--n:5; --tinta:var(--lila-claro)"></span>
				<span class="marco" style="--n:6; --tinta:var(--azul)"></span>
				<span class="velo"></span>
			</div>

			<div class="cuenta aparece" id="cuenta-activa" style="--i:1">
				<p class="rotulo" id="prefijo">T −</p>
				<p class="reloj" role="timer" aria-live="off"><span data-unidad="horas">--</span>:<span data-unidad="minutos">--</span>:<span data-unidad="segundos">--</span></p>
				<p class="rotulo">para el inicio</p>
			</div>

			<!-- Se muestra cuando la cuenta llega a cero -->
			<div class="cuenta" id="cuenta-terminada" hidden>
				<p class="rotulo">La Cup</p>
				<p class="partio">Ya partió</p>
				<p class="rotulo">a agendar</p>
			</div>
		</section>

		<section class="pie">
			<div class="titulo aparece" style="--i:2">
				<h1>SDR Cup</h1>
				<p class="edicion">New Generation</p>
			</div>

			<div class="datos aparece" style="--i:3">
				<!-- Barra que se llena durante las últimas 24 horas. Las marcas las crea el script. -->
				<div class="avance" id="avance">
					<div class="avance-cabeza">
						<span>Últimas 24 horas</span>
						<span id="porcentaje"></span>
					</div>
					<div class="marcas" id="marcas" aria-hidden="true"></div>
				</div>

				<!-- La fecha de inicio se cambia solo aquí: el script lee el atributo datetime -->
				<dl class="ficha">
					<div>
						<dt>Inicio</dt>
						<dd><time id="inicio" datetime="2026-10-13T10:00:00-03:00">Mar 13 oct · 10:00</time></dd>
					</div>
					<div>
						<dt>Cierre</dt>
						<dd><time datetime="2026-10-16T17:00:00-03:00">Vie 16 oct · 17:00</time></dd>
					</div>
					<div>
						<dt>Formato</dt>
						<dd>Squad 1 vs Squad 2</dd>
					</div>
				</dl>
			</div>
		</section>
	</main>

	<script src="js/cuenta-regresiva.js" defer></script>
</body>
</html>
