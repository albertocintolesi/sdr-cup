<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>SDR Cup New Generation</title>
	<meta name="description" content="Cuenta regresiva para la SDR Cup New Generation de Brolly.">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#EAF1FB">
	<meta property="og:title" content="SDR Cup New Generation">
	<meta property="og:description" content="Parte el martes 13 de octubre a las 10:00. Mira la cuenta regresiva.">
	<meta property="og:type" content="website">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%238B85F0'/%3E%3Cstop offset='1' stop-color='%234B3FBF'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">

	<!-- Tipografías de la guía de marca de Brolly.
	     Cada familia de Fontshare va en su propio enlace: pedidas juntas, la segunda no llega. -->
	<link rel="preconnect" href="https://api.fontshare.com">
	<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet">
	<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
	<!-- Atmósfera de marca: retícula fina y un halo -->
	<div class="fondo" aria-hidden="true">
		<div class="reticula"></div>
		<div class="halo"></div>
	</div>

	<main class="escena">
		<header class="cabecera aparece" style="--i:0">
			<span class="marca">Brolly</span>
			<span class="etiqueta">Cup #3</span>
		</header>

		<h1 class="solo-lectores">SDR Cup New Generation</h1>

		<!-- La copa se dibuja en js/copa.js -->
		<div class="copa-marco">
			<canvas id="copa" aria-hidden="true"></canvas>
		</div>

		<section class="cuenta" aria-label="Cuenta regresiva">
			<div id="cuenta-activa">
				<p class="cuenta-titulo aparece" style="--i:1">La Cup parte en</p>
				<div class="reloj aparece" style="--i:2" role="timer" aria-live="off">
					<div class="unidad">
						<span class="num" data-unidad="dias">--</span>
						<span class="rotulo">días</span>
					</div>
					<div class="unidad">
						<span class="num" data-unidad="horas">--</span>
						<span class="rotulo">horas</span>
					</div>
					<div class="unidad">
						<span class="num" data-unidad="minutos">--</span>
						<span class="rotulo">min</span>
					</div>
					<div class="unidad">
						<span class="num" data-unidad="segundos">--</span>
						<span class="rotulo">seg</span>
					</div>
				</div>
			</div>

			<!-- Se muestra cuando la cuenta llega a cero -->
			<div class="partio" id="cuenta-terminada" hidden>
				<p class="partio-titulo">La Cup ya <em>partió</em></p>
				<p class="partio-texto">A agendar reuniones.</p>
			</div>

			<!-- La fecha de inicio se cambia solo aquí: el script lee el atributo datetime -->
			<p class="cuenta-fecha aparece" style="--i:3">
				<time id="inicio" datetime="2026-10-13T10:00:00-03:00">Martes 13 de octubre, 10:00 hrs</time>
			</p>
		</section>
	</main>

	<script src="js/cuenta-regresiva.js" defer></script>
	<script src="js/copa.js" defer></script>
</body>
</html>
